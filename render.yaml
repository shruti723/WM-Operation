services:
  - type: web
    name: fm-operations-app
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NPM_VERSION
        value: 10.7.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
